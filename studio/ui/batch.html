<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="studio-token" content="__STUDIO_TOKEN__">
  <title>Studio batch</title>
  <link rel="stylesheet" href="/ui/studio.css">
</head>
<body data-page="batch">
  <header class="top">
    <a href="/" class="back">&larr; Batches</a>
    <h1 id="batch-title">Batch</h1>
    <span id="batch-platform" class="pill"></span>
  </header>
  <div class="layout">
    <nav id="rail" class="rail" aria-label="Steps"></nav>
    <main class="wrap">
      <div id="banner" class="banner" role="alert" hidden>
        <span id="banner-text"></span>
        <span class="banner-actions">
          <button id="banner-retry" type="button" hidden>Retry</button>
          <button id="banner-close" type="button">Dismiss</button>
        </span>
      </div>
      <section id="next" class="next" aria-live="polite"></section>
      <section id="settings" class="settings"></section>
      <section id="panel" class="card"></section>
      <section class="card">
        <h3>Latest job <span id="job-status" class="pill"></span> <span id="job-elapsed" class="muted"></span></h3>
        <pre id="job-log" class="log">No jobs yet.</pre>
        <div class="row"><button id="job-retry" type="button" hidden>Retry</button></div>
      </section>
    </main>
  </div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <script src="/ui/studio.js"></script>
</body>
</html>
