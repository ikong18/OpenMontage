<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="studio-token" content="__STUDIO_TOKEN__">
  <title>Studio</title>
  <link rel="stylesheet" href="/ui/studio.css">
</head>
<body data-page="home">
  <header class="top"><h1>Studio</h1><span class="muted">local shorts factory</span></header>
  <main class="wrap">
    <section class="card">
      <h2>New batch</h2>
      <form id="new-batch" class="row">
        <label>Name <input id="batch-name" required placeholder="Space facts 03"></label>
        <label>Platform
          <select id="batch-platform">
            <option value="facebook_reels">Facebook Reels</option>
            <option value="youtube_shorts">YouTube Shorts</option>
          </select>
        </label>
        <button type="submit" class="primary">Create batch</button>
      </form>
      <p id="new-batch-error" class="error" hidden></p>
    </section>
    <section class="card">
      <h2>Batches</h2>
      <ul id="batch-list" class="list"></ul>
    </section>
  </main>
  <script src="/ui/studio.js"></script>
</body>
</html>
